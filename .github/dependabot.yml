---
version: 2
updates:
    - package-ecosystem: "pip"
      directory: "/"
      target-branch: "main"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:00"
          timezone: "UTC"
      commit-message:
          prefix: "chore(deps)"
      labels:
          - "dependencies"
          - "security"
      rebase-strategy: "disabled"
      open-pull-requests-limit: 5
      groups:
          python-deps:
              patterns:
                  - "*"

    - package-ecosystem: "pip"
      directory: "/pyrolysis_lignocellulosic_ai_training"
      target-branch: "main"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:15"
          timezone: "UTC"
      commit-message:
          prefix: "chore(deps)"
      labels:
          - "dependencies"
          - "security"
      rebase-strategy: "disabled"
      open-pull-requests-limit: 5
      groups:
          python-training-deps:
              patterns:
                  - "*"

    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "main"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:30"
          timezone: "UTC"
      commit-message:
          prefix: "chore(ci)"
      labels:
          - "dependencies"
          - "ci"
      rebase-strategy: "disabled"
      open-pull-requests-limit: 2

    - package-ecosystem: "docker"
      directory: "/docker"
      target-branch: "main"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "07:00"
          timezone: "UTC"
      commit-message:
          prefix: "chore(docker)"
      labels:
          - "dependencies"
          - "docker"
      rebase-strategy: "disabled"
      open-pull-requests-limit: 2
