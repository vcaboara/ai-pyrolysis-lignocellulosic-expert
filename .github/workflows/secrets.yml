name: Secret Scan

on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: "0 6 * * 1"

jobs:
    gitleaks:
        name: Gitleaks secret scan
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  args: --config-path .gitleaks.toml --redact --exit-code 1 --report-format sarif --report-path results/gitleaks.sarif
