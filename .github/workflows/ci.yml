name: CI
run-name: CI / ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker/docker-compose.yml

    steps:
      - name: Report branch or PR context
        shell: bash
        run: |
          echo "Ref: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Base ref: ${{ github.base_ref || 'n/a' }}"
          echo "Head ref: ${{ github.head_ref || 'n/a' }}"
          echo "## Branch / PR status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base ref: ${{ github.base_ref || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Head ref: ${{ github.head_ref || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build CI container image, run tests + security + deps-audit + style + typing (compose)
        run: |
          docker compose --profile ci build ci

      - name: Run privacy check (compose)
        run: |
          docker compose --profile ci up --abort-on-container-exit --exit-code-from ci --no-build ci

      - name: Cleanup compose resources
        if: always()
        run: |
          docker compose --profile ci down --rmi local --volumes --remove-orphans
