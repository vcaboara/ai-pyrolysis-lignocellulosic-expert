name: CI
run-name: CI / ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Report branch or PR context
        shell: bash
        run: |
          echo "Ref: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Base ref: ${{ github.base_ref || 'n/a' }}"
          echo "Head ref: ${{ github.head_ref || 'n/a' }}"
          echo "## Branch / PR status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base ref: ${{ github.base_ref || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Head ref: ${{ github.head_ref || 'n/a' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pyrolysis_lignocellulosic_ai_training/requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests + security + privacy + style + typing
        run: |
          python run_local_ci.py --tests --security --privacy --format --lint --mypy
